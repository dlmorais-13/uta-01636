# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']
    paths:
      - www/**

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./www
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './www/package-lock.json'
      - name: Install website dependencies
        run: npm ci
      - name: Create .env
        run: |
          cat << EOF > .env
          # TODO This must be updated to prod values in the future.
          # None of this information is sensitive.
          VITE_BASE_PATH="/uta-01636/"
          VITE_AGOL_CLIENT_ID=NfSH0XwqlYxRLRu7
          VITE_AGOL_BASE_LAYER_VIEW_ID=5dd898c8ec424e6181c5ade98b8eb37d
          VITE_AGOL_SIMULATIONS_LAYER_VIEW_ID=124c9592bc7046d58868dd442c38cf4c
          VITE_AGOL_QUEUE_FEATURE_ID=786b3e9813ec4357a9fd4727c1f36426
      - name: Build website
        run: npm run build
      - name: Setup pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: './www/dist/'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
